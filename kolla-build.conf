[DEFAULT]
maintainer = nimbolus Team
registry = quay.io
namespace = nimbolus
image_name_prefix = openstack-kolla-
base = rocky
base_arch = x86_64
platform = linux/amd64
template_override = template_overrides.j2
# not supported yet
# patches_path = patches

[glance-api-additions-patches]
type = local
location = patches/glance-api/

[neutron-server-additions-patches]
type = local
location = patches/neutron-server/

[neutron-l3-agent-additions-patches]
type = local
location = patches/neutron-l3-agent/

[neutron-bgp-dragent-additions-patches]
type = local
location = patches/neutron-bgp-dragent/

[profiles]
custom = fluentd,^keystone$,glance-api,neutron-server,neutron-l3-agent,neutron-bgp-dragent
